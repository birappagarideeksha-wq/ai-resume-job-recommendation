{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="container">
    <div class="card p-4">
        <h2>Resume Analysis Dashboard</h2>
        <p class="text-muted">Upload a text-based PDF resume to get job recommendations.</p>

        <form action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-bold">Upload Resume (PDF)</label>
                <input id="resume" class="form-control" type="file" name="resume" accept=".pdf" required>
                <small id="filename" class="text-muted">No file selected</small>
            </div>
            <button class="btn btn-primary">Analyze Resume</button>
        </form>
    </div>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
